name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    if: github.repository == 'ReiSuzunami/greentyper-ci'
    name: Quality / macOS ARM
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record toolchain and host
        run: |
          rustc -Vv
          uname -a
          uname -m
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets --locked
      - name: Test workspace
        run: cargo test --workspace --all-targets --locked
      - name: Test storage candidates
        run: cargo test -p greentyper-acceptance --all-targets --features bench-storage --locked
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Lint storage candidates
        run: cargo clippy -p greentyper-acceptance --all-targets --features bench-storage --locked -- -D warnings

  windows:
    if: github.repository == 'ReiSuzunami/greentyper-ci'
    name: Windows x64 build
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record toolchain and host
        shell: pwsh
        run: |
          rustc -Vv
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber, OsArchitecture
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets --locked
      - name: Test workspace
        run: cargo test --workspace --all-targets --locked
      - name: Test storage candidates
        run: cargo test -p greentyper-acceptance --all-targets --features bench-storage --locked
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Lint storage candidates
        run: cargo clippy -p greentyper-acceptance --all-targets --features bench-storage --locked -- -D warnings
      - name: Build release binaries
        run: cargo build --workspace --release --locked
      - name: Build storage candidate runner
        run: cargo build -p greentyper-acceptance --release --features bench-storage --target-dir target/bench-storage --locked
      - name: Verify CPU baseline and acceptance harness
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          target/release/greentyper-acceptance.exe verify-cpu --expect-baseline x86-64-v3
          target/release/greentyper-acceptance.exe run `
            --candidate-id "ci-$env:GITHUB_SHA" `
            --source-revision "$env:GITHUB_SHA" `
            --output dist/acceptance-smoke.json `
            --runs 3 `
            --warmup-runs 1 `
            --expect-baseline x86-64-v3 `
            --machine-identifiers redacted
          target/release/greentyper-acceptance.exe bench `
            --comparison harness `
            --implementation sha256-loop `
            --workload sha256-loop `
            --candidate-id "ci-$env:GITHUB_SHA" `
            --source-revision "$env:GITHUB_SHA" `
            --output dist/benchmark-harness-smoke.json `
            --runs 1 `
            --warmup-runs 1 `
            --expect-baseline x86-64-v3 `
            --machine-identifiers redacted
      - name: Verify storage candidate pipeline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force candidate-smoke | Out-Null
          target/bench-storage/release/greentyper-acceptance.exe verify-cpu --expect-baseline x86-64-v3
          target/bench-storage/release/greentyper-acceptance.exe bench `
            --comparison storage `
            --implementation sqlite-wal `
            --workload critical-append-replay `
            --candidate-id "ci-$env:GITHUB_SHA" `
            --source-revision "$env:GITHUB_SHA" `
            --output candidate-smoke/storage-sqlite-wal.json `
            --runs 1 `
            --warmup-runs 1 `
            --expect-baseline x86-64-v3 `
            --machine-identifiers redacted
          target/bench-storage/release/greentyper-acceptance.exe bench `
            --comparison storage `
            --implementation append-log `
            --workload critical-append-replay `
            --candidate-id "ci-$env:GITHUB_SHA" `
            --source-revision "$env:GITHUB_SHA" `
            --output candidate-smoke/storage-append-log.json `
            --runs 1 `
            --warmup-runs 1 `
            --expect-baseline x86-64-v3 `
            --machine-identifiers redacted
          target/bench-storage/release/greentyper-acceptance.exe bench `
            --comparison storage `
            --implementation sqlite-wal `
            --workload cross-process-crash-replay `
            --candidate-id "ci-$env:GITHUB_SHA" `
            --source-revision "$env:GITHUB_SHA" `
            --output candidate-smoke/storage-sqlite-wal-crash.json `
            --runs 1 `
            --warmup-runs 1 `
            --expect-baseline x86-64-v3 `
            --machine-identifiers redacted
          target/bench-storage/release/greentyper-acceptance.exe bench `
            --comparison storage `
            --implementation append-log `
            --workload cross-process-crash-replay `
            --candidate-id "ci-$env:GITHUB_SHA" `
            --source-revision "$env:GITHUB_SHA" `
            --output candidate-smoke/storage-append-log-crash.json `
            --runs 1 `
            --warmup-runs 1 `
            --expect-baseline x86-64-v3 `
            --machine-identifiers redacted
      - name: Package portable build
        id: package
        shell: pwsh
        run: |
          Copy-Item target/release/greentyper.exe dist/
          Copy-Item target/release/greentyper-acceptance.exe dist/
          Copy-Item README.md, LICENSE dist/
          $archive = "greentyper-windows-x86-64-v3-$env:GITHUB_SHA.zip"
          Compress-Archive -Path dist/* -DestinationPath $archive -Force
          "archive=$archive" >> $env:GITHUB_OUTPUT
      - name: Upload portable build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: greentyper-windows-x86-64-v3-${{ github.sha }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload storage candidate smoke
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: greentyper-storage-candidate-smoke-${{ github.sha }}
          path: candidate-smoke/*.json
          if-no-files-found: error
          retention-days: 14
