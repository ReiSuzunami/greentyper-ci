name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    if: github.repository == 'ReiSuzunami/greentyper-ci'
    name: Quality / macOS ARM
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record toolchain and host
        run: |
          rustc -Vv
          uname -a
          uname -m
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets --locked
      - name: Test workspace
        run: cargo test --workspace --all-targets --locked
      - name: Test storage candidates
        run: cargo test -p greentyper-acceptance --all-targets --features bench-storage --locked
      - name: Test terminal candidates
        run: cargo test -p greentyper-acceptance --all-targets --features bench-terminal --locked
      - name: Test transport candidates
        run: cargo test -p greentyper-acceptance --all-targets --features bench-transport --locked
      - name: Test system allocator candidate
        run: cargo test -p greentyper-acceptance --all-targets --features bench-allocator-system --locked
      - name: Test Mimalloc candidate
        run: cargo test -p greentyper-acceptance --all-targets --features bench-allocator-mimalloc --locked
      - name: Test Snmalloc candidate
        run: cargo test -p greentyper-acceptance --all-targets --features bench-allocator-snmalloc --locked
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Lint storage candidates
        run: cargo clippy -p greentyper-acceptance --all-targets --features bench-storage --locked -- -D warnings
      - name: Lint terminal candidates
        run: cargo clippy -p greentyper-acceptance --all-targets --features bench-terminal --locked -- -D warnings
      - name: Lint transport candidates
        run: cargo clippy -p greentyper-acceptance --all-targets --features bench-transport --locked -- -D warnings
      - name: Lint system allocator candidate
        run: cargo clippy -p greentyper-acceptance --all-targets --features bench-allocator-system --locked -- -D warnings
      - name: Lint Mimalloc candidate
        run: cargo clippy -p greentyper-acceptance --all-targets --features bench-allocator-mimalloc --locked -- -D warnings
      - name: Lint Snmalloc candidate
        run: cargo clippy -p greentyper-acceptance --all-targets --features bench-allocator-snmalloc --locked -- -D warnings

  windows:
    if: github.repository == 'ReiSuzunami/greentyper-ci'
    name: Windows x64 build
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record toolchain and host
        shell: pwsh
        run: |
          rustc -Vv
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber, OsArchitecture
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets --locked
      - name: Test workspace
        run: cargo test --workspace --all-targets --locked
      - name: Test storage candidates
        run: cargo test -p greentyper-acceptance --all-targets --features bench-storage --locked
      - name: Test terminal candidates
        run: cargo test -p greentyper-acceptance --all-targets --features bench-terminal --locked
      - name: Test transport candidates
        run: cargo test -p greentyper-acceptance --all-targets --features bench-transport --locked
      - name: Test system allocator candidate
        run: cargo test -p greentyper-acceptance --all-targets --features bench-allocator-system --locked
      - name: Test Mimalloc candidate
        run: cargo test -p greentyper-acceptance --all-targets --features bench-allocator-mimalloc --locked
      - name: Test Snmalloc candidate
        env:
          CXXFLAGS: /wd4864
        run: cargo test -p greentyper-acceptance --all-targets --features bench-allocator-snmalloc --locked
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Lint storage candidates
        run: cargo clippy -p greentyper-acceptance --all-targets --features bench-storage --locked -- -D warnings
      - name: Lint terminal candidates
        run: cargo clippy -p greentyper-acceptance --all-targets --features bench-terminal --locked -- -D warnings
      - name: Lint transport candidates
        run: cargo clippy -p greentyper-acceptance --all-targets --features bench-transport --locked -- -D warnings
      - name: Lint system allocator candidate
        run: cargo clippy -p greentyper-acceptance --all-targets --features bench-allocator-system --locked -- -D warnings
      - name: Lint Mimalloc candidate
        run: cargo clippy -p greentyper-acceptance --all-targets --features bench-allocator-mimalloc --locked -- -D warnings
      - name: Lint Snmalloc candidate
        env:
          CXXFLAGS: /wd4864
        run: cargo clippy -p greentyper-acceptance --all-targets --features bench-allocator-snmalloc --locked -- -D warnings
      - name: Build release binaries
        run: cargo build --workspace --release --locked
      - name: Build storage candidate runner
        run: cargo build -p greentyper-acceptance --release --features bench-storage --target-dir target/bench-storage --locked
      - name: Build terminal candidate runner
        run: cargo build -p greentyper-acceptance --release --features bench-terminal --target-dir target/bench-terminal --locked
      - name: Build WinHTTP candidate runner
        run: cargo build -p greentyper-acceptance --release --features bench-transport-winhttp --target-dir target/bench-transport-winhttp --locked
      - name: Build Reqwest candidate runner
        run: cargo build -p greentyper-acceptance --release --features bench-transport-reqwest --target-dir target/bench-transport-reqwest --locked
      - name: Build system allocator candidate runner
        run: cargo build -p greentyper-acceptance --release --features bench-allocator-system --target-dir target/bench-allocator-system --locked
      - name: Build Mimalloc candidate runner
        run: cargo build -p greentyper-acceptance --release --features bench-allocator-mimalloc --target-dir target/bench-allocator-mimalloc --locked
      - name: Build Snmalloc candidate runner
        env:
          CXXFLAGS: /wd4864
        run: cargo build -p greentyper-acceptance --release --features bench-allocator-snmalloc --target-dir target/bench-allocator-snmalloc --locked
      - name: Verify CPU baseline and acceptance harness
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          target/release/greentyper-acceptance.exe verify-cpu --expect-baseline x86-64-v3
          target/release/greentyper-acceptance.exe run `
            --candidate-id "ci-$env:GITHUB_SHA" `
            --source-revision "$env:GITHUB_SHA" `
            --output dist/acceptance-smoke.json `
            --runs 3 `
            --warmup-runs 1 `
            --expect-baseline x86-64-v3 `
            --machine-identifiers redacted
          target/release/greentyper-acceptance.exe bench `
            --comparison harness `
            --implementation sha256-loop `
            --workload sha256-loop `
            --candidate-id "ci-$env:GITHUB_SHA" `
            --source-revision "$env:GITHUB_SHA" `
            --output dist/benchmark-harness-smoke.json `
            --runs 1 `
            --warmup-runs 1 `
            --expect-baseline x86-64-v3 `
            --machine-identifiers redacted
      - name: Verify storage candidate pipeline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force candidate-smoke | Out-Null
          target/bench-storage/release/greentyper-acceptance.exe verify-cpu --expect-baseline x86-64-v3
          target/bench-storage/release/greentyper-acceptance.exe bench `
            --comparison storage `
            --implementation sqlite-wal `
            --workload critical-append-replay `
            --candidate-id "ci-$env:GITHUB_SHA" `
            --source-revision "$env:GITHUB_SHA" `
            --output candidate-smoke/storage-sqlite-wal.json `
            --runs 1 `
            --warmup-runs 1 `
            --expect-baseline x86-64-v3 `
            --machine-identifiers redacted
          target/bench-storage/release/greentyper-acceptance.exe bench `
            --comparison storage `
            --implementation append-log `
            --workload critical-append-replay `
            --candidate-id "ci-$env:GITHUB_SHA" `
            --source-revision "$env:GITHUB_SHA" `
            --output candidate-smoke/storage-append-log.json `
            --runs 1 `
            --warmup-runs 1 `
            --expect-baseline x86-64-v3 `
            --machine-identifiers redacted
          target/bench-storage/release/greentyper-acceptance.exe bench `
            --comparison storage `
            --implementation sqlite-wal `
            --workload timer-expiry-streaming-replay `
            --candidate-id "ci-$env:GITHUB_SHA" `
            --source-revision "$env:GITHUB_SHA" `
            --output candidate-smoke/storage-sqlite-wal-timer.json `
            --runs 1 `
            --warmup-runs 1 `
            --expect-baseline x86-64-v3 `
            --machine-identifiers redacted
          target/bench-storage/release/greentyper-acceptance.exe bench `
            --comparison storage `
            --implementation append-log `
            --workload timer-expiry-streaming-replay `
            --candidate-id "ci-$env:GITHUB_SHA" `
            --source-revision "$env:GITHUB_SHA" `
            --output candidate-smoke/storage-append-log-timer.json `
            --runs 1 `
            --warmup-runs 1 `
            --expect-baseline x86-64-v3 `
            --machine-identifiers redacted
          target/bench-storage/release/greentyper-acceptance.exe bench `
            --comparison storage `
            --implementation sqlite-wal `
            --workload cas-one-winner `
            --candidate-id "ci-$env:GITHUB_SHA" `
            --source-revision "$env:GITHUB_SHA" `
            --output candidate-smoke/storage-sqlite-wal-cas.json `
            --runs 1 `
            --warmup-runs 1 `
            --expect-baseline x86-64-v3 `
            --machine-identifiers redacted
          target/bench-storage/release/greentyper-acceptance.exe bench `
            --comparison storage `
            --implementation append-log `
            --workload cas-one-winner `
            --candidate-id "ci-$env:GITHUB_SHA" `
            --source-revision "$env:GITHUB_SHA" `
            --output candidate-smoke/storage-append-log-cas.json `
            --runs 1 `
            --warmup-runs 1 `
            --expect-baseline x86-64-v3 `
            --machine-identifiers redacted
          target/bench-storage/release/greentyper-acceptance.exe bench `
            --comparison storage `
            --implementation sqlite-wal `
            --workload interrupted-migration `
            --candidate-id "ci-$env:GITHUB_SHA" `
            --source-revision "$env:GITHUB_SHA" `
            --output candidate-smoke/storage-sqlite-wal-migration.json `
            --runs 1 `
            --warmup-runs 1 `
            --expect-baseline x86-64-v3 `
            --machine-identifiers redacted
          target/bench-storage/release/greentyper-acceptance.exe bench `
            --comparison storage `
            --implementation append-log `
            --workload interrupted-migration `
            --candidate-id "ci-$env:GITHUB_SHA" `
            --source-revision "$env:GITHUB_SHA" `
            --output candidate-smoke/storage-append-log-migration.json `
            --runs 1 `
            --warmup-runs 1 `
            --expect-baseline x86-64-v3 `
            --machine-identifiers redacted
          target/bench-storage/release/greentyper-acceptance.exe bench `
            --comparison storage `
            --implementation sqlite-wal `
            --workload cross-process-crash-replay `
            --candidate-id "ci-$env:GITHUB_SHA" `
            --source-revision "$env:GITHUB_SHA" `
            --output candidate-smoke/storage-sqlite-wal-crash.json `
            --runs 1 `
            --warmup-runs 1 `
            --expect-baseline x86-64-v3 `
            --machine-identifiers redacted
          target/bench-storage/release/greentyper-acceptance.exe bench `
            --comparison storage `
            --implementation append-log `
            --workload cross-process-crash-replay `
            --candidate-id "ci-$env:GITHUB_SHA" `
            --source-revision "$env:GITHUB_SHA" `
            --output candidate-smoke/storage-append-log-crash.json `
            --runs 1 `
            --warmup-runs 1 `
            --expect-baseline x86-64-v3 `
            --machine-identifiers redacted
          target/bench-storage/release/greentyper-acceptance.exe bench `
            --comparison storage `
            --implementation sqlite-wal `
            --workload sqlite-vfs-fault-recovery `
            --candidate-id "ci-$env:GITHUB_SHA" `
            --source-revision "$env:GITHUB_SHA" `
            --output candidate-smoke/storage-sqlite-wal-vfs-fault.json `
            --runs 1 `
            --warmup-runs 1 `
            --expect-baseline x86-64-v3 `
            --machine-identifiers redacted
      - name: Verify terminal candidate pipeline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force terminal-smoke | Out-Null
          target/bench-terminal/release/greentyper-acceptance.exe verify-cpu --expect-baseline x86-64-v3
          target/bench-terminal/release/greentyper-acceptance.exe bench `
            --comparison terminal `
            --implementation direct-vt `
            --workload render-matrix `
            --candidate-id "ci-$env:GITHUB_SHA" `
            --source-revision "$env:GITHUB_SHA" `
            --output terminal-smoke/terminal-direct-vt.json `
            --runs 1 `
            --warmup-runs 1 `
            --expect-baseline x86-64-v3 `
            --machine-identifiers redacted
          target/bench-terminal/release/greentyper-acceptance.exe bench `
            --comparison terminal `
            --implementation ratatui-crossterm `
            --workload render-matrix `
            --candidate-id "ci-$env:GITHUB_SHA" `
            --source-revision "$env:GITHUB_SHA" `
            --output terminal-smoke/terminal-ratatui-crossterm.json `
            --runs 1 `
            --warmup-runs 1 `
            --expect-baseline x86-64-v3 `
            --machine-identifiers redacted
      - name: Verify transport candidate pipeline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force transport-smoke | Out-Null
          target/bench-transport-winhttp/release/greentyper-acceptance.exe verify-cpu --expect-baseline x86-64-v3
          target/bench-transport-winhttp/release/greentyper-acceptance.exe bench `
            --comparison transport `
            --implementation winhttp-wrest `
            --workload loopback-sse `
            --candidate-id "ci-$env:GITHUB_SHA" `
            --source-revision "$env:GITHUB_SHA" `
            --output transport-smoke/transport-winhttp-wrest.json `
            --runs 1 `
            --warmup-runs 1 `
            --expect-baseline x86-64-v3 `
            --machine-identifiers redacted
          target/bench-transport-reqwest/release/greentyper-acceptance.exe verify-cpu --expect-baseline x86-64-v3
          target/bench-transport-reqwest/release/greentyper-acceptance.exe bench `
            --comparison transport `
            --implementation reqwest-rustls `
            --workload loopback-sse `
            --candidate-id "ci-$env:GITHUB_SHA" `
            --source-revision "$env:GITHUB_SHA" `
            --output transport-smoke/transport-reqwest-rustls.json `
            --runs 1 `
            --warmup-runs 1 `
            --expect-baseline x86-64-v3 `
            --machine-identifiers redacted
      - name: Verify allocator candidate pipeline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force allocator-smoke | Out-Null
          target/bench-allocator-system/release/greentyper-acceptance.exe verify-cpu --expect-baseline x86-64-v3
          target/bench-allocator-system/release/greentyper-acceptance.exe bench `
            --comparison allocator `
            --implementation system `
            --workload allocation-pressure `
            --candidate-id "ci-$env:GITHUB_SHA" `
            --source-revision "$env:GITHUB_SHA" `
            --output allocator-smoke/allocator-system.json `
            --runs 1 `
            --warmup-runs 1 `
            --expect-baseline x86-64-v3 `
            --machine-identifiers redacted
          target/bench-allocator-mimalloc/release/greentyper-acceptance.exe verify-cpu --expect-baseline x86-64-v3
          target/bench-allocator-mimalloc/release/greentyper-acceptance.exe bench `
            --comparison allocator `
            --implementation mimalloc `
            --workload allocation-pressure `
            --candidate-id "ci-$env:GITHUB_SHA" `
            --source-revision "$env:GITHUB_SHA" `
            --output allocator-smoke/allocator-mimalloc.json `
            --runs 1 `
            --warmup-runs 1 `
            --expect-baseline x86-64-v3 `
            --machine-identifiers redacted
          target/bench-allocator-snmalloc/release/greentyper-acceptance.exe verify-cpu --expect-baseline x86-64-v3
          target/bench-allocator-snmalloc/release/greentyper-acceptance.exe bench `
            --comparison allocator `
            --implementation snmalloc `
            --workload allocation-pressure `
            --candidate-id "ci-$env:GITHUB_SHA" `
            --source-revision "$env:GITHUB_SHA" `
            --output allocator-smoke/allocator-snmalloc.json `
            --runs 1 `
            --warmup-runs 1 `
            --expect-baseline x86-64-v3 `
            --machine-identifiers redacted
          $files = @(Get-ChildItem allocator-smoke/*.json)
          if ($files.Count -ne 3) { throw "allocator smoke did not produce exactly three evidence files" }
          $evidence = $files | ForEach-Object { Get-Content $_ -Raw | ConvertFrom-Json }
          $implementations = @($evidence | ForEach-Object { $_.implementation.name } | Sort-Object -Unique)
          $digests = @($evidence | ForEach-Object { $_.samples[0].output_digest } | Select-Object -Unique)
          $executables = @($evidence | ForEach-Object { $_.executable_sha256 } | Select-Object -Unique)
          $dependencies = @($evidence | ForEach-Object { $_.implementation.dependency_fingerprint } | Select-Object -Unique)
          if (($implementations -join ",") -ne "mimalloc,snmalloc,system") { throw "allocator evidence identities are incomplete" }
          if ($digests.Count -ne 1) { throw "allocator candidates produced different correctness digests" }
          if ($digests[0] -ne "cc7fa5d58ecec3bde194f364ebe7ab03bc453cd9d38dc4b7ebfe2c606609c184") { throw "allocator correctness digest does not match the frozen fixture" }
          if ($executables.Count -ne 3) { throw "allocator candidates did not produce three distinct executables" }
          if ($dependencies.Count -ne 3) { throw "allocator candidates did not produce three distinct dependency identities" }
      - name: Package portable build
        id: package
        shell: pwsh
        run: |
          Copy-Item target/release/greentyper.exe dist/
          Copy-Item target/release/greentyper-acceptance.exe dist/
          Copy-Item README.md, LICENSE dist/
          $archive = "greentyper-windows-x86-64-v3-$env:GITHUB_SHA.zip"
          Compress-Archive -Path dist/* -DestinationPath $archive -Force
          "archive=$archive" >> $env:GITHUB_OUTPUT
      - name: Upload portable build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: greentyper-windows-x86-64-v3-${{ github.sha }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload storage candidate smoke
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: greentyper-storage-candidate-smoke-${{ github.sha }}
          path: candidate-smoke/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload terminal candidate smoke
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: greentyper-terminal-candidate-smoke-${{ github.sha }}
          path: terminal-smoke/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload transport candidate smoke
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: greentyper-transport-candidate-smoke-${{ github.sha }}
          path: transport-smoke/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload allocator candidate smoke
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: greentyper-allocator-candidate-smoke-${{ github.sha }}
          path: allocator-smoke/*.json
          if-no-files-found: error
          retention-days: 14
