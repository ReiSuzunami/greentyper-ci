[package]
name = "greentyper"
description = "Windows-first GreenTyper coding-agent runtime"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
crossterm = { version = "0.29.0", default-features = false, features = ["events", "windows"] }
greentyper-core = { path = "../greentyper-core" }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
rpassword = "7.4.0"
serde = "1.0.229"
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = "0.11.0"
toml = "1.1.4"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.178"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
rcgen = "0.14.5"
rustls = "0.23.43"

[lints]
workspace = true
